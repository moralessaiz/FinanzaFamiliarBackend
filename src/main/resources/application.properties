# ============================================================
# FinanzaFamiliar - Configuracion de la API REST (Spring Boot)
# ============================================================

# Nombre y puerto del servicio. La API queda en http://localhost:8080/api
spring.application.name=finanzafamiliar-backend
server.port=8080

# ----- Conexion JDBC a MySQL -----
# Es la misma base de datos y el mismo usuario de la version con Servlets
# (antes estaban escritos en ConexionBD.java). Spring Boot abre y cierra
# las conexiones por medio de un pool (HikariCP).
#
# ${DB_USUARIO:finanza_user} significa: usar la variable de entorno DB_USUARIO
# y, si no existe, el valor por defecto finanza_user. Asi cada integrante puede
# usar sus propios datos sin modificar este archivo.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/finanzafamiliar?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota
spring.datasource.username=${DB_USUARIO:finanza_user}
spring.datasource.password=${DB_CLAVE:Finanza2026*}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ----- CORS -----
# Direccion del front-end Angular al que se le permite consumir la API.
finanzafamiliar.cors.origen-permitido=${CORS_ORIGEN:http://localhost:4200}

# ----- Formato JSON -----
# Las fechas viajan como texto "aaaa-mm-dd" (no como numeros).
spring.jackson.serialization.write-dates-as-timestamps=false
# Si el JSON trae un campo que no existe en el modelo, se responde 400 en lugar de ignorarlo.
spring.jackson.deserialization.fail-on-unknown-properties=true
